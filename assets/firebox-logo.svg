<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"><animate attributeName="stop-color" values="#ff0000;#ff6a00;#ff0000" dur="2s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ff6a00"><animate attributeName="stop-color" values="#ff6a00;#ff0000;#ff6a00" dur="2s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- BLACK BACKGROUND -->
  <rect width="800" height="300" rx="30" fill="black"/>

  <!-- FLOWING LOVE HEARTS - ANIMATED -->
  <g opacity="0.6">
    <text x="100" y="150" font-size="30">❤️<animateTransform attributeName="transform" type="translate" values="0 0; 0 -200; 0 0" dur="4s" repeatCount="indefinite"/></text>
    <text x="200" y="200" font-size="25">💖<animateTransform attributeName="transform" type="translate" values="0 0; 0 -150; 0 0" dur="3s" repeatCount="indefinite"/></text>
    <text x="600" y="180" font-size="30">💕<animateTransform attributeName="transform" type="translate" values="0 0; 0 -180; 0 0" dur="3.5s" repeatCount="indefinite"/></text>
    <text x="700" y="220" font-size="20">❤️<animateTransform attributeName="transform" type="translate" values="0 0; 0 -100; 0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="50" y="220" font-size="20">💗<animateTransform attributeName="transform" type="translate" values="0 0; 0 -120; 0 0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="500" y="250" font-size="28">💖<animateTransform attributeName="transform" type="translate" values="0 0; 0 -200; 0 0" dur="4s" repeatCount="indefinite"/></text>
  </g>

  <!-- REDTECH AI - ANIMATED PULSING -->
  <g filter="url(#glow)">
    <text x="400" y="150" text-anchor="middle" font-family="Arial Black" font-size="62" font-weight="900" fill="url(#redGrad)" letter-spacing="2">
      🔥 ✦ 𝐑𝐄𝐃𝐓𝐄𝐂𝐇-𝐀𝐈 ┃ 
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" additive="sum" dur="1.5s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- SUBTITLE - FADE ANIMATION -->
  <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="16" letter-spacing="6" fill="white" opacity="0.9">
    THE ULTIMATE WHATSAPP POWER-BOT
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
