<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mixed color background, not pure black -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#2d0a2e"/>
      <stop offset="100%" stop-color="#4a0a2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#ff2a2a"/>
    </linearGradient>
  </defs>
  
  <!-- Smaller background, mixed colors -->
  <rect width="800" height="300" rx="30" fill="url(#bg)"/>
  
  <!-- Floating love hearts -->
  <g opacity="0.8" font-size="24">
    <text x="50" y="60">💖</text>
    <text x="150" y="80">❤️</text>
    <text x="300" y="50">💕</text>
    <text x="500" y="70">💜</text>
    <text x="700" y="60">💖</text>
    <text x="100" y="250">💜</text>
    <text x="250" y="270">💖</text>
    <text x="650" y="250">❤️</text>
  </g>

  <!-- Centered Text -->
  <g text-anchor="middle">
    <text x="400" y="160" font-family="Arial Black" font-size="68" font-weight="900" fill="url(#textGrad)">🔥 𝐑𝐄𝐃𝐓𝐄𝐂𝐇 𝐀𝐈</text>
    <text x="400" y="210" font-family="Arial" font-size="16" letter-spacing="5" fill="#ffffff" opacity="0.9">THE ULTIMATE WHATSAPP POWER-BOT</text>
  </g>
</svg>
