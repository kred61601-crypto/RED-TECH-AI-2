<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="350" rx="25" fill="black"/>
  
  <!-- Flying hearts background -->
  <g opacity="0.7">
    <text x="100" y="300" font-size="24" fill="#ff6b8a">❤️
      <animate attributeName="y" from="350" to="-20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;120;90;100" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="350" font-size="20" fill="#ff8da1">💖
      <animate attributeName="y" from="380" to="-20" dur="5s" repeatCount="indefinite" begin="0.5s"/>
    </text>
    <text x="350" y="320" font-size="28" fill="#ff4d6d">💕
      <animate attributeName="y" from="360" to="-20" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </text>
    <text x="550" y="340" font-size="22" fill="#ff8da1">❤️
      <animate attributeName="y" from="380" to="-20" dur="4.5s" repeatCount="indefinite" begin="0.2s"/>
    </text>
    <text x="700" y="300" font-size="26" fill="#ff6b8a">💖
      <animate attributeName="y" from="350" to="-20" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
    </text>
    <text x="850" y="330" font-size="24" fill="#ff4d6d">💕
      <animate attributeName="y" from="370" to="-20" dur="5.5s" repeatCount="indefinite" begin="0.8s"/>
    </text>
    <text x="450" y="360" font-size="18" fill="#ffb3c1">❤️
      <animate attributeName="y" from="400" to="-20" dur="6s" repeatCount="indefinite" begin="2s"/>
    </text>
  </g>

  <!-- Main Text - PERFECTLY CENTERED -->
  <g text-anchor="middle">
    <text x="500" y="175" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#ff3333" stroke="#ff0000" stroke-width="1" filter="url(#glow)">🔥 𝐑𝐄𝐃𝐓𝐄𝐂𝐇 𝐀𝐈</text>
    <text x="500" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white" letter-spacing="6">THE ULTIMATE WHATSAPP POWER-BOT</text>
  </g>
  
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
