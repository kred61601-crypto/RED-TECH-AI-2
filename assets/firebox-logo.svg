<svg width="100%" height="120" viewBox="0 0 800 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px #FF6A00); }
      50% { opacity: 0.4; filter: drop-shadow(0 0 2px #FF0080); }
    }
    @keyframes move {
      0% { transform: translateX(0px); }
      50% { transform: translateX(8px); }
      100% { transform: translateX(0px); }
    }
    .animated-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: url(#glowGrad);
      animation: blink 2s infinite ease-in-out, move 4s infinite ease-in-out;
    }
    .sub-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #A0AEC0;
      letter-spacing: 5px;
    }
     <!-- Smaller background, mixed colors -->
  <rect width="800" height="300" rx="30" fill="url(#bg)"/>
  
  <!-- Floating love hearts -->
  <g opacity="0.8" font-size="24">
    <text x="50" y="60">💖</text>
    <text x="150" y="80">❤️</text>
    <text x="300" y="50">💕</text>
    <text x="500" y="70">💜</text>
    <text x="700" y="60">💖</text>
    <text x="100" y="250">💜</text>
    <text x="250" y="270">💖</text>
    <text x="650" y="250">❤️</text>
  </g>
  </style>
  <rect width="100%" height="100%" rx="12" fill="#0D0E15" />
  <g transform="translate(40, 20)">
    <!-- Animated Flame Icon -->
    <g transform="translate(0, 10)">
      <text font-size="60" y="87">🔥</text>
    </g>
    <!-- Text group -->
    <text x="120" y="87" class="animated-text"> 🔥 𝐑𝐄𝐃𝐓𝐄𝐂𝐇 𝐀𝐈</text>
    <text x="120" y="99" class="sub-text">THE ULTIMATE WHATSAPP POWER-BOT</text>
  </g>
</svg>
